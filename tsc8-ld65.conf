MEMORY {
	RAM:  start = $0000, size = $8000;
	ROM:  start = $e000, size = $2000;
}


SEGMENTS {
	ZPG:     load = RAM, type = rw;
	STK:     load = RAM, type = rw, start=$0100;
	PROG:    load = RAM, type = rw, start=$0200;
	CODE:    load = ROM, type = ro;
    RODATA:  load = ROM, type = ro;
	DATA:    load = ROM, type = ro;
	BSS:     load = RAM, type = bss, define = yes;
	VECTOR:  load = ROM, type = ro, start=$fffa;
}
