MEMORY {
	RAM:  start = $0000, size = $8000;
	CART: start = $1000, size = $7000;
	ROM:  start = $e000, size = $2000;
}


SEGMENTS {
	ZPG:     load = RAM, type = rw;
	STK:     load = RAM, type = rw, start=$0100;

	CART:    load = CART, type = ro, start=$1000;
	CARTDAT: load = CART, type = rw;
	CARTBSS: load = CART, type = bss, define = yes;

	CODE:    load = ROM, type = ro;
	DATA:    load = ROM, type = ro;
	MONITOR: load = ROM, type = ro, start=$e100;
	UTILS:   load = ROM, type = ro, start=$f000;
	VECTOR:  load = ROM, type = ro, start=$fffa;
}
